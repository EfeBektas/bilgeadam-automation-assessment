name: .NET Test CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore TestAutomation/TestAutomation.sln

      - name: Build solution
        run: dotnet build TestAutomation/TestAutomation.sln --configuration Release --no-restore

      - name: Run tests (NUnit parallel config = 4 workers)
        run: dotnet test TestAutomation/TestAutomation.sln --configuration Release --no-build
